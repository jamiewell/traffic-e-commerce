//shipment.proto
syntax = "proto3";
package com.ecommerce.proto;

option java_multiple_files = true;
option java_package = "com.ecommerce.proto";
option java_outer_classname = "OrderEvent";


// 주문 생성 이벤트
message OrderCreatedEvent {
  string orderUUID = 1;
  string userId = 2;
  string address = 3;
  string contact = 4;
  double totalPrice = 5;
  repeated OrderCreatedItem items = 6;
  string status = 7;
}


message OrderCreatedItem {
  string productUUID = 1;
  int32 quantity = 2;
  double price = 3;
}




// 주문 취소 이벤트
message OrderCancelledEvent {
  string order_uuid = 1;                    // 주문 UUID
  int64 cancelled_dt = 2;                   // 취소 시간
}


// 재고확인 요청 이벤트
message SagaStockCheckEvent {
  string order_uuid = 1;
  repeated DeductItem items = 2;
  int64 deduct_dt = 3;
}


// 재고차감 요청 이벤트
message SagaStockDeductEvent {
  string order_uuid = 1;
  repeated DeductItem items = 2;
  int64 deduct_dt = 3;
}


// 재고 차감할 상품 정보
message DeductItem {
  string product_uuid = 1;
  int32 deduct_quantity = 2;
  int32 remaining_stock = 3;
}


// 재고 복구 이벤트
message SagaStockRestoreEvent {
  string order_uuid = 1;
  repeated RestoreItem items = 2;
  int64 restored_dt = 3;
}


// 복구할 상품 정보
message RestoreItem {
  string product_uuid = 1;
  int32 restored_quantity = 2;
  int32 current_stock = 3;
}


// 결제 요청 이벤트
message SagaPaymentRequestEvent {
  string order_uuid = 1;                    // 주문 UUID
  double totalPrice = 2;                    // 결제 금액
  int64 requested_dt = 3;                   // 요청 시간 (Unix timestamp)
}

// 결제 취소 요청 이벤트
message SagaPaymentCancelRequestEvent {
  string order_uuid = 1;                    // 주문 UUID
  int64 requested_dt = 2;                   // 요청 시간 (Unix timestamp)
}


// 배송 요청 이벤트
message SagaShipmentRequestEvent {
  string order_uuid = 1;                    // 주문 UUID
  string user_id = 2;                       // 주문자 ID
  string delivery_address = 3;              // 배송 주소
  string contact_phone = 4;                 // 연락처
  repeated ShipmentItem items = 5;          // 배송할 상품 목록
  int64 requested_dt = 8;                   // 요청 시간 (Unix timestamp)
}

// 배송 취소 요청 이벤트
message SagaShipmentCancelRequestEvent {
  string order_uuid = 1;                    // 주문 UUID
  int64 requested_dt = 2;                   // 요청 시간 (Unix timestamp)
}




// 배송 상품 정보
message ShipmentItem {
  string product_uuid = 1;                  // 상품 UUID
  int32 quantity = 2;                       // 수량
  double price = 3;                         // 가격
}
